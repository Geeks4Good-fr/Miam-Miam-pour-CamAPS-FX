# Réglages Gradle de « Meal Announcer ».
# La machine a peu de mémoire : on laisse le tas modeste et on n'active pas le
# parallélisme, pour ne pas gêner les autres compilations en cours.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
